name: quiz

on:
  push:
    paths:
      - "features/quiz/**"
      - ".github/workflows/quiz.yml"
      - ".github/actions/**"
      - "internal/tooling/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter quiz lint
