name: quiz

on:
  push:
    paths:
      - "features/quiz/**"
      - "internal/tooling/**"
      - "apps/cli/**"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/quiz.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check packages
        run: pnpm lint

      - name: Check build
        run: pnpm build:web
